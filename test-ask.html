<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار Gemini AI</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; }
  textarea, button { width: 100%; padding: 12px; font-size: 15px; border-radius: 8px; margin-top: 10px; }
  textarea { background: #222; color: #eee; border: 1px solid #444; }
  button { background: #4f7cff; color: #fff; border: none; font-weight: bold; }
  #answer { margin-top: 20px; padding: 15px; background: #1a1a1a; border-radius: 8px; white-space: pre-wrap; min-height: 40px; }
</style>
</head>
<body>
  <h2>اختبار Gemini AI</h2>
  <textarea id="q" rows="3" placeholder="اكتب سؤالك هنا...">لماذا يحصل مشروع مطعم في دبي بميزانية 200 ألف دولار على تقييم 78 من 100؟ أجب بجملتين فقط.</textarea>
  <button onclick="ask()">اسأل Gemini</button>
  <div id="answer">الإجابة ستظهر هنا...</div>

<script>
async function ask() {
  const question = document.getElementById('q').value;
  const answerEl = document.getElementById('answer');
  answerEl.textContent = "جاري الاتصال بـ Gemini...";
  try {
    const res = await fetch('https://buildx-backend.vercel.app/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const data = await res.json()
    if (!data.success) throw new Error(JSON.stringify(data, null, 2));
    answerEl.textContent = data.answer;
  } catch (err) {
    answerEl.textContent = "خطأ: " + err.message;
  }
}
</script>
</body>
</html>
