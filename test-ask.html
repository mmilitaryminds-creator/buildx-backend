<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار Gemini - BuildX</title>
</head>
<body>
    <h1>اختبار الاتصال بـ Gemini</h1>
    
    <button onclick="askGemini()">اضغط هنا للتجربة</button>
    
    <div id="result" style="margin-top: 20px; font-size: 20px; font-weight: bold; color: blue;"></div>

    <script>
        async function askGemini() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = "جاري الاتصال...";

            try {
                // إرسال طلب إلى الـ Endpoint الذي أنشأناه في مجلد api
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt: 'ما هو الاسم المختصر لـ BuildX؟' })
                });

                const data = await response.json();

                // عرض النتيجة على الشاشة مباشرة
                if (data.result) {
                    resultDiv.innerText = "نجح الاتصال! رد Gemini: " + data.result;
                } else {
                    resultDiv.innerText = "فشل الاتصال. الخطأ: " + (data.error || "خطأ غير معروف");
                }

            } catch (error) {
                resultDiv.innerText = "خطأ في الشبكة: " + error;
            }
        }
    </script>
</body>
</html>
