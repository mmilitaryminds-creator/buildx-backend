<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار API</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; font-size: 16px; }
        button { width: 100%; padding: 15px; background: blue; color: white; border: none; font-size: 16px; cursor: pointer; }
        .result { margin-top: 20px; padding: 20px; background: #e8f5e9; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>اختبار BuildX API</h1>
        
        <input type="text" id="city" placeholder="المدينة (مثال: New York)" value="New York">
        <input type="text" id="businessType" placeholder="نوع المشروع (مثال: مطعم)" value="مطعم">
        <input type="number" id="budget" placeholder="الميزانية (مثال: 50000)" value="50000">
        
        <button onclick="testAPI()">اختبر الـ API</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function testAPI() {
            const city = document.getElementById('city').value;
            const businessType = document.getElementById('businessType').value;
            const budget = document.getElementById('budget').value;
            const resultDiv = document.getElementById('result');

            resultDiv.innerHTML = '<p style="color: blue;">جاري الاختبار...</p>';

            try {
                const response = await fetch('https://buildx-backend.vercel.app/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        city: city,
                        businessType: businessType,
                        budget: parseInt(budget)
                    })
                });

                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="result">
                        <h3>النتيجة:</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Response:</strong></p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="result" style="background: #ffebee;"><p style="color: red;">خطأ: ${error.message}</p></div>`;
            }
        }
    </script>
</body>
</html>
