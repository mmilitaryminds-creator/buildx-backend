<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuildX Engine</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; }
    .card { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; }
    input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 15px; box-sizing: border-box; }
    input { background: #334155; color: #fff; }
    button { background: #2563eb; color: #fff; font-weight: bold; cursor: pointer; }
    .result { margin-top: 15px; padding: 12px; background: #0f172a; border-radius: 8px; font-family: monospace; white-space: pre-wrap; font-size: 13px; color: #4ade80; overflow-x: auto; }
  </style>
</head>
<body>
  <div class="card">
    <h2>BuildX Data Engine</h2>
    <label>اسم المشروع أو المنطقة:</label>
    <input type="text" id="projectInput" placeholder="اكتب البيانات للتحليل...">
    <button onclick="runAnalysis()">تشغيل المحرك (POST /api/analyze)</button>

    <div id="output" class="result">النتائج ستظهر هنا بعد الضغط على الزر...</div>
  </div>

  <script>
    async function runAnalysis() {
      const inputVal = document.getElementById('projectInput').value || 'مشروع تجريبي';
      const output = document.getElementById('output');
      output.innerText = "جاري الاتصال بالمحرك...";

      try {
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ project: inputVal, region: 'global' })
        });
        const data = await response.json();
        output.innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        output.innerText = "خطأ في الاتصال: " + err.message;
      }
    }
  </script>
</body>
</html>
