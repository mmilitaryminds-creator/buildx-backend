<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuildX Engine</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; }
    .card { background: #1e293b; padding: 24px; border-radius: 12px; max-width: 480px; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; }
    label { display: block; margin-top: 12px; margin-bottom: 4px; font-size: 14px; color: #94a3b8; }
    input { width: 100%; padding: 10px; background: #334155; border: 1px solid #475569; color: #fff; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; margin-top: 18px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .result { margin-top: 15px; padding: 12px; background: #020617; border-radius: 6px; font-family: monospace; font-size: 13px; color: #4ade80; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>

  <div class="card">
    <h2>BuildX Data Engine</h2>
    
    <label>الدولة (Country):</label>
    <input type="text" id="country" placeholder="مثال: الجزائر">

    <label>المدينة (City):</label>
    <input type="text" id="city" placeholder="مثال: الجزائر العاصمة">

    <label>نوع النشاط (Business Type):</label>
    <input type="text" id="businessType" placeholder="مثال: مقهى / منصة رقمية">

    <label>الميزانية (Budget):</label>
    <input type="number" id="budget" placeholder="مثال: 50000">

    <button onclick="runAnalysis()">تشغيل المحرك (POST /api/analyze)</button>

    <div id="output" class="result">النتائج ستظهر هنا بعد الضغط على الزر...</div>
  </div>

  <script>
    async function runAnalysis() {
      const output = document.getElementById('output');
      output.innerText = "... جاري الاتصال بالمحرك ...";

      const payload = {
        country: document.getElementById('country').value,
        city: document.getElementById('city').value,
        businessType: document.getElementById('businessType').value,
        budget: Number(document.getElementById('budget').value)
      };

      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        output.innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        output.innerText = "حدث خطأ في الاتصال: " + err.message;
      }
    }
  </script>

</body>
</html>
