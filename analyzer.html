<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحليل السوق - BuildX Data Engine</title>
    <!-- استيراد الخطوط العصرية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3a8a; /* أزرق ملكي داكن */
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc; /* خلفية فاتحة نظيفة */
            --text-main: #0f172a;
            --text-muted: #475569;
            --white: #ffffff;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* شريط التنقل العلوي (مبسط) */
        header {
            width: 100%;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--white);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary-color);
            text-decoration: none;
        }

        .back-link {
            font-size: 14px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        
        .back-link:hover {
            color: var(--primary-light);
        }

        /* المحتوى الرئيسي */
        .main-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
        }

        h1 {
            font-size: 32px;
            color: var(--primary-color);
            margin-bottom: 10px;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 16px;
        }

        /* نموذج الإدخال */
        .analysis-form {
            background: var(--white);
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-color);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* زر التحليل */
        .analyze-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: var(--white);
            padding: 14px 20px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }

        .analyze-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .analyze-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        /* منطقة النتائج (مخفية حتى تظهر النتيجة) */
        #result {
            display: none; /* مخفي افتراضياً */
            background: var(--white);
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            margin-bottom: 40px;
        }

        .result-header {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eff6ff;
        }

        .result-content {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-muted);
            /* تنسيق النص القادم من الـ AI ليكون مقروءاً */
            white-space: pre-wrap; 
        }

        /* حالة التحميل */
        #loading {
            display: none; /* مخفي افتراضياً */
            text-align: center;
            color: var(--text-muted);
            margin: 20px 0;
            font-size: 16px;
        }

        .spinner {
            border: 4px solid #f3f3f3; /* Light grey */
            border-top: 4px solid var(--primary-color); /* Blue */
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <header>
        <a href="index.html" class="back-link">← العودة للرئيسية</a>
        <a href="index.html" class="logo">BuildX</a>
        <div></div> <!-- مسافة فارغة لموازنة التصميم -->
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-container">
        <h1>تحليل ذكي لمشروعك</h1>
        <p class="subtitle">أدخل بيانات مشروعك للحصول على رؤى السوق الاسترشادية</p>

        <!-- نموذج الإدخال -->
        <form id="analysisForm" class="analysis-form">
            <div class="form-group">
                <label for="country">الدولة:</label>
                <input type="text" id="country" name="country" placeholder="مثال: الإمارات" required>
            </div>
            <div class="form-group">
                <label for="city">المدينة:</label>
                <input type="text" id="city" name="city" placeholder="مثال: دبي" required>
            </div>
            <div class="form-group">
                <label for="activity">النشاط التجاري:</label>
                <input type="text" id="activity" name="activity" placeholder="مثال: مطعم بيتزا" required>
            </div>
            <button type="submit" id="submitBtn" class="analyze-btn">تحليل المشروع</button>
        </form>

        <!-- منطقة التحميل -->
        <div id="loading">
            <div class="spinner"></div>
            جاري تحليل البيانات وصياغة التقرير...
        </div>

        <!-- منطقة النتائج -->
        <div id="result">
            <div class="result-header">تقرير تحليل السوق</div>
            <div id="resultContent" class="result-content">
                <!-- هنا سيتم عرض النتيجة التي تأتي من API -->
            </div>
        </div>
    </main>

    <!-- جافا سكريبت للربط مع الـ API -->
    <script>
        const form = document.getElementById('analysisForm');
        const countryInput = document.getElementById('country');
        const cityInput = document.getElementById('city');
        const activityInput = document.getElementById('activity');
        const submitBtn = document.getElementById('submitBtn');
        const loadingDiv = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        const resultContent = document.getElementById('resultContent');

        // رابط الـ API الخلفي الذي برمجناه (تأكد أنه صحيح)
        const API_URL = 'https://buildx-backend-1.onrender.com/analyze'; // استخدم الرابط الجديد

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // جمع البيانات من الحقول
            const country = countryInput.value;
            const city = cityInput.value;
            const activity = activityInput.value;

            // إظهار حالة التحميل وإخفاء النتائج
            submitBtn.disabled = true;
            loadingDiv.style.display = 'block';
            resultDiv.style.display = 'none';
            resultContent.innerHTML = '';

            try {
                // إرسال الطلب إلى الـ API
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ country, city, activity })
                });

                if (!response.ok) {
                    throw new Error('حدث خطأ في الاتصال بالخادم');
                }

                // قراءة النتيجة
                const data = await response.json();
                
                // عرض النتيجة بشكل جميل
                resultContent.innerHTML = data.analysis || 'لم يتم العثور على بيانات تحليل.';
                resultDiv.style.display = 'block';

            } catch (error) {
                // عرض رسالة خطأ
                resultContent.innerHTML = 'عذراً، حدث خطأ أثناء تحليل البيانات. يرجى المحاولة لاحقاً.<br>الخطأ: ' + error.message;
                resultDiv.style.display = 'block';
                resultDiv.style.borderColor = '#fecaca'; // حدود حمراء في حالة الخطأ
                resultDiv.style.backgroundColor = '#fef2f2';
                resultContent.style.color = '#991b1b';
            } finally {
                // إعادة تفعيل الزر وإخفاء التحميل
                submitBtn.disabled = false;
                loadingDiv.style.display = 'none';
            }
        });
    </script>

</body>
</html>
