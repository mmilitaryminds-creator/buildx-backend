<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحليل السوق المتقدم - BuildX Data Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #475569;
            --white: #ffffff;
            --border-color: #e2e8f0;
            --error-bg: #fef2f2;
            --error-border: #fca5a5;
            --error-text: #991b1b;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            width: 100%;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--white);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary-color);
            text-decoration: none;
        }

        .back-link {
            font-size: 14px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        
        .back-link:hover {
            color: var(--primary-color);
        }

        .main-container {
            max-width: 750px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
        }

        h1 {
            font-size: 32px;
            color: var(--primary-color);
            margin-bottom: 10px;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 16px;
        }

        .analysis-form {
            background: var(--white);
            padding: 35px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .optional-tag {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 400;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px 15px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-color);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* صندوق التنبيه الذكي للتناقضات */
        #smartAlert {
            display: none;
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .analyze-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: var(--white);
            padding: 14px 20px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(30, 58, 138, 0.2);
        }

        .analyze-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .analyze-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        #loading {
            display: none;
            text-align: center;
            color: var(--text-muted);
            margin: 20px 0;
            font-size: 16px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #result {
            display: none;
            background: var(--white);
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            margin-bottom: 40px;
        }

        .result-header {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eff6ff;
        }

        .result-content {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-muted);
            white-space: pre-wrap;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-link">← العودة للرئيسية</a>
        <a href="index.html" class="logo">BuildX</a>
        <div></div>
    </header>

    <main class="main-container">
        <h1>محرك تحليل السوق الذكي</h1>
        <p class="subtitle">أدخل تفاصيل مشروع بدقة للحصول على تقييم استرشادي متقدم</p>

        <form id="analysisForm" class="analysis-form">
            
            <!-- تنبيه ذكي للأخطاء -->
            <div id="smartAlert"></div>

            <div class="form-grid">
                <!-- الدولة -->
                <div class="form-group">
                    <label for="country">الدولة:</label>
                    <input type="text" id="country" name="country" placeholder="مثال: الجزائر، الإمارات..." required>
                </div>

                <!-- المدينة -->
                <div class="form-group">
                    <label for="city">المدينة:</label>
                    <input type="text" id="city" name="city" placeholder="مثال: الجزائر العاصمة، دبي..." required>
                </div>

                <!-- نوع المشروع (خيارات احترافية) -->
                <div class="form-group full-width">
                    <label for="activitySelect">نوع المشروع:</label>
                    <select id="activitySelect" required>
                        <option value="" disabled selected>اختر قطاع المشروع...</option>
                        <option value="Café">☕ مقهى (Café)</option>
                        <option value="Restaurant">🍔 مطعم (Restaurant)</option>
                        <option value="Grocery Store">🏪 متجر مواد غذائية (Grocery Store)</option>
                        <option value="Gym">🏋️ نادي رياضي (Gym)</option>
                        <option value="Hotel">🏨 فندق أو إقامة (Hotel)</option>
                        <option value="Retail Store">🛍️ متجر تجزئة (Retail Store)</option>
                        <option value="Tech Business">💻 مشروع تقني/برمجيات (Tech Business)</option>
                        <option value="Other">➕ نشاط آخر (Other)</option>
                    </select>
                </div>

                <!-- خانة إضافية تظهر إذا اخترنا نشاط آخر -->
                <div class="form-group full-width" id="customActivityGroup" style="display: none;">
                    <label for="customActivity">حدد النشاط التجاري بدقة:</label>
                    <input type="text" id="customActivity" placeholder="اكتب النشاط هنا...">
                </div>

                <!-- الميزانية -->
                <div class="form-group">
                    <label for="budget">الميزانية المتوقعة:</label>
                    <input type="number" id="budget" name="budget" placeholder="مثال: 50000" required>
                </div>

                <!-- الموقع / العنوان (اختياري) -->
                <div class="form-group">
                    <label for="location">العنوان أو الحي <span class="optional-tag">(اختياري)</span>:</label>
                    <input type="text" id="location" name="location" placeholder="مثال: شارع الرئيسي، حي البستان">
                </div>

                <!-- المساحة (اختياري) -->
                <div class="form-group full-width">
                    <label for="area">مساحة المشروع بالمتر المربع <span class="optional-tag">(اختياري)</span>:</label>
                    <input type="number" id="area" name="area" placeholder="مثال: 120">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="analyze-btn">Analyze Business</button>
        </form>

        <div id="loading">
            <div class="spinner"></div>
            جاري فحص المعطيات ومطابقة بيانات السوق بالذكاء الاصطناعي...
        </div>

        <div id="result">
            <div class="result-header">تقرير تحليل الاستثمار</div>
            <div id="resultContent" class="result-content"></div>
        </div>
    </main>

    <script>
        const form = document.getElementById('analysisForm');
        const activitySelect = document.getElementById('activitySelect');
        const customActivityGroup = document.getElementById('customActivityGroup');
        const customActivityInput = document.getElementById('customActivity');
        const smartAlert = document.getElementById('smartAlert');
        const submitBtn = document.getElementById('submitBtn');
        const loadingDiv = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        const resultContent = document.getElementById('resultContent');

        const API_URL = 'https://buildx-backend-1.onrender.com/analyze';

        // إظهار خانة النشاط المخصص إذا اختار المستخدم "Other"
        activitySelect.addEventListener('change', (e) => {
            if (e.target.value === 'Other') {
                customActivityGroup.style.display = 'block';
                customActivityInput.required = true;
            } else {
                customActivityGroup.style.display = 'none';
                customActivityInput.required = false;
            }
        });

        // قاعدة بيانات بسيطة وذكية لاكتشاف التناقضات الفجة (مثل وضع مدينة أمريكية بدولة عربية والعكس كمثال توضيحي)
        function detectContradictions(country, city) {
            const c = country.trim().toLowerCase();
            const ci = city.trim().toLowerCase();

            // أمثلة لاكتشاف التناقضات الشائعة
            if ((c.includes('الجزائر') || c.includes('algeria')) && (ci.includes('new york') || ci.includes('نيويورك') || ci.includes('paris') || ci.includes('باريس'))) {
                return '⚠️ تنبيه ذكي من BuildX: يبدو أن هناك تناقضاً؛ لقد اخترت دولة الجزائر بينما المدينة المدخلة تتبع دولة أخرى. يرجى تصحيح المعطيات لضمان دقة التحليل.';
            }
            if ((c.includes('الامارات') || c.includes('uae') || c.includes('united arab emirates')) && (ci.includes('الجزائر') || ci.includes('algiers'))) {
                return '⚠️ تنبيه ذكي من BuildX: تناقض رصدي؛ المدينة لا تتطابق مع الدولة المدخلة. تحقق من البيانات من فضلك.';
            }
            return null;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            smartAlert.style.display = 'none';
            smartAlert.innerHTML = '';

            const country = document.getElementById('country').value.trim();
            const city = document.getElementById('city').value.trim();
            
            // تحديد النشاط النهائي بناءً على القائمة أو الخانة المخصصة
            let activity = activitySelect.value;
            if (activity === 'Other') {
                activity = customActivityInput.value.trim();
            }

            const budget = document.getElementById('budget').value;
            const location = document.getElementById('location').value;
            const area = document.getElementById('area').value;

            // 1. فحص التناقض الذكي
            const contradictionError = detectContradictions(country, city);
            if (contradictionError) {
                smartAlert.innerHTML = contradictionError;
                smartAlert.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            // تجميع النص الكامل للنشاط والميزانية لإرساله للـ API الخلفي
            const fullActivityPayload = `${activity} (الميزانية: ${budget}، الموقع: غير محدد، المساحة: ${area ? area + ' م2' : 'غير محددة'})`;

            submitBtn.disabled = true;
            loadingDiv.style.display = 'block';
            resultDiv.style.display = 'none';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        country: country, 
                        city: city, 
                        activity: fullActivityPayload 
                    })
                });

                if (!response.ok) throw new Error('خطأ في استجابة الخادم الخلفي.');

                const data = await response.json();
                resultContent.innerHTML = data.analysis || 'لم يتم استرجاع نتائج كافية.';
                resultDiv.style.display = 'block';
                window.scrollTo({ top: resultDiv.offsetTop - 20, behavior: 'smooth' });

            } catch (error) {
                resultContent.innerHTML = 'عذراً، حدث خطأ أثناء الاتصال بالمحرك: ' + error.message;
                resultDiv.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                loadingDiv.style.display = 'none';
            }
        });
    </script>
</body>
</html>
