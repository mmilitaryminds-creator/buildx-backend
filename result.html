<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النتائج - BuildX</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', Arial; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #1e3a8a; margin-bottom: 30px; }
        #scoreBox { text-align: center; padding: 50px; border-radius: 16px; margin-bottom: 40px; font-size: 60px; font-weight: bold; color: white; }
        #scoreBox.excellent { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
        #scoreBox.good { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
        #scoreBox.poor { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .section { margin: 30px 0; padding: 25px; background: #f8fafc; border-radius: 12px; border-right: 4px solid #667eea; }
        .section h3 { color: #1e3a8a; margin-bottom: 15px; font-size: 20px; }
        .section p, .section li { color: #334155; line-height: 1.8; margin-bottom: 10px; }
        .section ul { margin-right: 20px; }
        button { padding: 12px 30px; margin: 10px 5px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-primary { background: #667eea; color: white; }
        .btn-secondary { background: #e2e8f0; color: #1e3a8a; }
        #loading { text-align: center; padding: 50px; }
        .spinner { border: 4px solid #e2e8f0; border-top: 4px solid #667eea; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 نتائج التحليل</h1>
        
        <div id="loading">
            <div class="spinner"></div>
            <p>جاري تحميل النتائج...</p>
        </div>

        <div id="content" style="display: none;">
            <div id="scoreBox" class="good">
                <div id="scoreValue">70</div>
                <div style="font-size: 24px; margin-top: 10px;" id="scoreLabel">جيد</div>
            </div>

            <div class="section">
                <h3>📖 التحليل الكامل</h3>
                <p id="explanation"></p>
            </div>

            <div style="text-align: center;">
                <button class="btn-primary" onclick="location.href='form.html'">تحليل مشروع آخر</button>
                <button class="btn-secondary" onclick="window.print()">طباعة</button>
            </div>
        </div>
    </div>

    <script>
        async function loadResults() {
            const params = new URLSearchParams(window.location.search);
            const city = params.get('city');
            const businessType = params.get('businessType');
            const budget = params.get('budget');

            if (!city || !businessType || !budget) {
                document.getElementById('loading').innerHTML = '<p style="color: red;">خطأ: بيانات ناقصة</p>';
                return;
            }

            try {
                const response = await fetch('https://buildx-backend.vercel.app/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        city: city,
                        businessType: businessType,
                        budget: parseInt(budget)
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Display results
                    document.getElementById('scoreValue').textContent = data.score || 70;
                    document.getElementById('scoreLabel').textContent = data.scoreLabel || 'جيد';
                    document.getElementById('explanation').textContent = data.explanation || 'لا يوجد شرح';

                    // Color by score
                    const scoreBox = document.getElementById('scoreBox');
                    scoreBox.classList.remove('poor', 'good', 'excellent');
                    if (data.score >= 70) scoreBox.classList.add('excellent');
                    else if (data.score >= 30) scoreBox.classList.add('good');
                    else scoreBox.classList.add('poor');

                    // Hide loading, show content
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                } else {
                    throw new Error(data.error || 'خطأ غير معروف');
                }
            } catch (error) {
                document.getElementById('loading').innerHTML = `<p style="color: red;">خطأ: ${error.message}</p>`;
            }
        }

        // Load results on page load
        window.addEventListener('DOMContentLoaded', loadResults);
    </script>
</body>
</html>
