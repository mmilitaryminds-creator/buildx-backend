<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير الجدوى - BuildX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background: linear-gradient(135deg, #07111f 0%, #0f1f3f 50%, #0a1628 100%);
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
        }

        /* Background effects */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(22, 139, 255, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            left: -5%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 25s ease-in-out infinite reverse;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 50px;
        }

        .logo {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #168bff 0%, #9333ea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }

        .page-title {
            color: #e0e7ff;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        /* Loading */
        .loading {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 80px 40px;
            text-align: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            margin: 0 auto 30px;
            border: 4px solid rgba(22, 139, 255, 0.2);
            border-top-color: #168bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #cbd5e1;
            font-size: 18px;
        }

        /* Content */
        #content {
            display: none;
        }

        /* Project Info */
        .project-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(22, 139, 255, 0.2);
            border-radius: 16px;
            padding: 30px;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 14px;
            font-weight: 700;
            color: #e0e7ff;
        }

        /* Score Card */
        .score-card {
            background: linear-gradient(135deg, rgba(22, 139, 255, 0.1), rgba(147, 51, 234, 0.1));
            backdrop-filter: blur(20px);
            border: 2px solid rgba(22, 139, 255, 0.3);
            border-radius: 24px;
            padding: 60px 40px;
            text-align: center;
            margin-bottom: 40px;
        }

        .score-label {
            color: #94a3b8;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .score-big {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, #168bff 0%, #9333ea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 15px;
        }

        .score-title {
            font-size: 28px;
            font-weight: 800;
            color: #e0e7ff;
            margin-bottom: 12px;
        }

        .score-desc {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .score-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .score-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ef4444 0%, #f97316 25%, #eab308 50%, #84cc16 75%, #10b981 100%);
            border-radius: 10px;
            width: 0%;
            animation: fillScore 1.5s ease-out forwards;
        }

        @keyframes fillScore {
            from { width: 0%; }
            to { width: var(--score-pct); }
        }

        .confidence {
            color: #7c3aed;
            font-size: 14px;
            font-weight: 700;
        }

        /* Indicators Grid */
        .indicators-title {
            color: #e0e7ff;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 30px;
            margin-top: 50px;
        }

        .indicators-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .indicator-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(22, 139, 255, 0.2);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .indicator-card:hover {
            border-color: #168bff;
            transform: translateY(-4px);
        }

        .indicator-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .indicator-name {
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 12px;
            min-height: 32px;
        }

        .indicator-score {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #168bff 0%, #9333ea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .indicator-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .indicator-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #168bff, #9333ea);
            border-radius: 10px;
            width: 0%;
            animation: fillBar 1s ease-out forwards;
        }

        @keyframes fillBar {
            from { width: 0%; }
            to { width: var(--bar-pct); }
        }

        /* Sections */
        .section {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(22, 139, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 800;
            color: #e0e7ff;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-icon {
            font-size: 28px;
        }

        .section-list {
            list-style: none;
        }

        .section-list li {
            padding: 16px;
            margin-bottom: 12px;
            background: rgba(22, 139, 255, 0.05);
            border: 1px solid rgba(22, 139, 255, 0.2);
            border-left: 4px solid #168bff;
            border-radius: 12px;
            color: #cbd5e1;
            font-size: 15px;
            line-height: 1.6;
        }

        .section-list li:last-child {
            margin-bottom: 0;
        }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 50px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #168bff 0%, #9333ea 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(22, 139, 255, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(22, 139, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e7ff;
            border: 1px solid rgba(22, 139, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(22, 139, 255, 0.1);
            border-color: #168bff;
        }

        /* Error */
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid rgba(239, 68, 68, 0.3);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
        }

        .error-title {
            font-size: 28px;
            font-weight: 800;
            color: #fca5a5;
            margin-bottom: 15px;
        }

        .error-msg {
            font-size: 16px;
            color: #fecaca;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Footer */
        footer {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-top: 80px;
            padding-bottom: 30px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 25px 15px;
            }

            .score-big {
                font-size: 72px;
            }

            .indicators-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="logo">BuildX</div>
            <h1 class="page-title">📊 تقرير جدوى المشروع</h1>
        </header>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">جاري تحليل المشروع...</div>
        </div>

        <!-- Content -->
        <div id="content">
            <!-- Project Info -->
            <div class="project-info" id="projectInfo"></div>

            <!-- Score Card -->
            <div class="score-card">
                <div class="score-label">مؤشر جدوى المشروع</div>
                <div class="score-big" id="scoreValue" style="--score-pct: 70%">70</div>
                <div class="score-title" id="scoreTitle">جيد</div>
                <div class="score-desc" id="scoreDesc">فرصة جيدة للنجاح</div>
                <div class="score-bar">
                    <div class="score-bar-fill" id="scoreBar" style="--score-pct: 70%"></div>
                </div>
                <div class="confidence">
                    مستوى الثقة: <span id="confidence">75</span>%
                </div>
            </div>

            <!-- Indicators -->
            <h2 class="indicators-title">📈 المؤشرات الرئيسية</h2>
            <div class="indicators-grid" id="indicators"></div>

            <!-- Strengths -->
            <div class="section">
                <h3 class="section-title">
                    <span class="section-icon">✅</span>
                    <span>نقاط القوة</span>
                </h3>
                <ul class="section-list" id="strengths"></ul>
            </div>

            <!-- Weaknesses -->
            <div class="section" id="weaknessesSection" style="display: none;">
                <h3 class="section-title">
                    <span class="section-icon">⚠️</span>
                    <span>نقاط الضعف والمخاطر</span>
                </h3>
                <ul class="section-list" id="weaknesses"></ul>
            </div>

            <!-- Recommendations -->
            <div class="section" id="recommendationsSection" style="display: none;">
                <h3 class="section-title">
                    <span class="section-icon">💡</span>
                    <span>التوصيات</span>
                </h3>
                <ul class="section-list" id="recommendations"></ul>
            </div>

            <!-- Buttons -->
            <div class="buttons">
                <button class="btn btn-primary" onclick="location.href='form.html'">🔄 تحليل آخر</button>
                <button class="btn btn-secondary" onclick="window.print()">🖨️ طباعة</button>
            </div>
        </div>

        <!-- Error -->
        <div class="error" id="error" style="display: none;">
            <div class="error-title">❌ خطأ في التحليل</div>
            <div class="error-msg" id="errorMsg"></div>
            <button class="btn btn-primary" onclick="location.href='form.html'">العودة</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 BuildX — منصة تحليل جدوى المشاريع الذكية</p>
    </footer>

    <script>
        async function analyze() {
            try {
                const params = new URLSearchParams(window.location.search);
                const country = params.get('country');
                const city = params.get('city');
                const businessType = params.get('businessType');
                const projectType = params.get('projectType');
                const audience = params.get('audience');
                const budget = params.get('budget');
                const area = params.get('area');

                if (!country || !city || !budget) throw new Error('بيانات ناقصة');

                // Show project info
                showProjectInfo(country, city, businessType, projectType, audience, budget, area);

                // Get feasibility
                const response = await fetch('https://buildx-backend.vercel.app/api/feasibility', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        country, city, businessType, budget: parseInt(budget), area: area ? parseInt(area) : null
                    })
                });

                if (!response.ok) throw new Error('خطأ في الاتصال');

                const data = await response.json();
                if (!data.success) throw new Error(data.error || 'فشل التحليل');

                showResults(data.feasibility);

            } catch (error) {
                showError(error.message);
            }
        }

        function showProjectInfo(country, city, business, project, audience, budget, area) {
            const html = `
                <div class="info-item">
                    <div class="info-label">🌍 الدولة</div>
                    <div class="info-value">${country}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">🏙️ المدينة</div>
                    <div class="info-value">${city}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">💼 النشاط</div>
                    <div class="info-value">${business}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">📦 النوع</div>
                    <div class="info-value">${project}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">💰 الميزانية</div>
                    <div class="info-value">$${parseInt(budget).toLocaleString()}</div>
                </div>
                ${area ? `<div class="info-item">
                    <div class="info-label">📐 المساحة</div>
                    <div class="info-value">${area} m²</div>
                </div>` : ''}
            `;
            document.getElementById('projectInfo').innerHTML = html;
        }

        function showResults(data) {
            const score = data.finalScore;
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            // Score
            document.getElementById('scoreValue').textContent = score;
            document.getElementById('scoreValue').style.setProperty('--score-pct', score + '%');
            document.getElementById('scoreTitle').textContent = data.interpretation;
            document.getElementById('scoreBar').style.setProperty('--score-pct', score + '%');
            document.getElementById('confidence').textContent = data.confidence;

            // Indicators
            const indicators = data.indicators;
            const indicatorsList = [
                { icon: '📈', name: 'الطلب', value: indicators.demand.score },
                { icon: '💰', name: 'الاقتصاد', value: indicators.economy.score },
                { icon: '💵', name: 'الميزانية', value: indicators.budget.score },
                { icon: '🏪', name: 'المنافسة', value: indicators.competition.score },
                { icon: '📍', name: 'الموقع', value: indicators.cityFit.score },
                { icon: '🚀', name: 'النمو', value: indicators.growth.score },
                { icon: '⚠️', name: 'المخاطر', value: indicators.risk.score }
            ];

            const indicatorsHtml = indicatorsList.map(ind => `
                <div class="indicator-card">
                    <div class="indicator-icon">${ind.icon}</div>
                    <div class="indicator-name">${ind.name}</div>
                    <div class="indicator-score">${ind.value}</div>
                    <div class="indicator-bar">
                        <div class="indicator-bar-fill" style="--bar-pct: ${ind.value}%"></div>
                    </div>
                </div>
            `).join('');

            document.getElementById('indicators').innerHTML = indicatorsHtml;

            // Strengths
            const strengthsHtml = data.strengths.map(s => `<li>${s}</li>`).join('');
            document.getElementById('strengths').innerHTML = strengthsHtml;

            // Weaknesses
            if (data.weaknesses && data.weaknesses.length > 0) {
            document.getElementById('weaknesses').innerHTML = weaknessesHtml;
            }

            // Recommendations
            if (data.recommendations && data.recommendations.length > 0) {
                document.getElementById('recommendationsSection').style.display = 'block';
                const recommendationsHtml = data.recommendations.map(r => `<li>${r}</li>`).join('');
                document.getElementById('recommendations').innerHTML = recommendationsHtml;
            }
        }

        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('errorMsg').textContent = msg;
        }

        analyze();
    </script>
</body>
</html>
