<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildX - نتيجة التحليل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="form-style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Build<span class="x">X</span></a>
    </header>

    <div class="page-title">
        <h1>نتيجة التحليل</h1>
        <p>هذه هي النتائج بناءً على بيانات مشروعك.</p>
    </div>

    <div class="form-container">
        <div class="analysis-result" id="analysisResult" style="display: block;">
            <h3 style="text-align: center; margin-bottom: 20px;">جاري تحليل البيانات...</h3>
        </div>
    </div>

    <footer style="text-align: center; padding: 20px; color: var(--gray-light); font-size: 14px;">
        <span>&copy; 2026 BuildX Data Engine. All rights reserved.</span>
    </footer>

    <script>
        // 1. قراءة البيانات من الرابط (URL Params)
        const params = new URLSearchParams(window.location.search);
        const country = params.get('country');
        const city = params.get('city');
        const businessType = params.get('businessType');
        const project = params.get('projectType');
        const audience = params.get('audience');
        const budget = params.get('budget');
        const area = params.get('area');
        const description = params.get('description');
        
        // التحقق من وجود البيانات
        if (!country || !city) {
            document.getElementById('analysisResult').innerHTML = `
                <div style="background: #ef4444; padding: 20px; border-radius: 10px; text-align: center;">
                    <h3>⚠️ تعذر إجراء التحليل</h3>
                    <p>البيانات غير موجودة في الرابط. يرجى العودة إلى نموذج التحليل وإعادة المحاولة.</p>
                </div>`;
        } else {
            // 2. إرسال البيانات إلى الخادم (api/chat.js)
            const projectData = {
                country: country,
                city: city,
                businessType: businessType,
                projectType: project,
                audience: audience,
                budget: budget,
                area: area
            };
            
            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: description, projectData: projectData })
            })
            .then(response => response.json())
            .then(data => {
                const resultDiv = document.getElementById('analysisResult');
                if (data.result) {
                    resultDiv.innerHTML = `<div style="border: 1px solid var(--card-border); border-radius: 20px; padding: 30px; line-height: 1.8;">
                        <h2 style="text-align: center; margin-bottom: 30px;">📊 تقرير BuildX</h2>
                        ${data.result}
                    </div>`;
                } else {
                    resultDiv.innerHTML = `<div style="background: #ef4444; padding: 20px; border-radius: 10px; text-align: center;">
                        <h3>⚠️ خطأ</h3>
                        <p>${data.error || "حدث خطأ ما"}</p>
                    </div>`;
                }
            })
            .catch(error => {
                document.getElementById('analysisResult').innerHTML = `<div style="background: #ef4444; padding: 20px; border-radius: 10px; text-align: center;">
                    <h3>⚠️ خطأ في الاتصال</h3>
                    <p>${error}</p>
                </div>`;
            });
        }
    </script>
</body>
</html>
