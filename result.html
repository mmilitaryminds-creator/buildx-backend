<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildX - تقرير تحليل السوق والذكاء الاصطناعي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-light: #3b82f6;
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #475569;
            --white: #ffffff;
            --border-color: #e2e8f0;
            --badge-confirmed: #dcfce7;
            --badge-confirmed-text: #166534;
            --badge-estimated: #fef9c3;
            --badge-estimated-text: #854d0e;
            --badge-unavailable: #fee2e2;
            --badge-unavailable-text: #991b1b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            width: 100%;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--white);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-color);
            text-decoration: none;
        }

        .back-btn {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--primary-color);
        }

        main {
            flex: 1;
            padding: 40px 5%;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .report-header {
            background: var(--white);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        .report-header h1 {
            font-size: 24px;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .project-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .meta-item {
            background: var(--bg-color);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .meta-item span {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .meta-item strong {
            font-size: 15px;
            color: var(--text-main);
        }

        /* بطاقة التوصية الاستثمارية للذكاء الاصطناعي */
        .ai-verdict-card {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: var(--white);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 10px 25px -5px rgba(30, 58, 138, 0.3);
        }

        .ai-verdict-card h2 {
            font-size: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .verdict-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .verdict-text {
            flex: 1;
            min-width: 250px;
        }

        .verdict-text p {
            font-size: 16px;
            line-height: 1.6;
            opacity: 0.95;
        }

        .verdict-score {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px 25px;
            border-radius: 14px;
            text-align: center;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .verdict-score span {
            display: block;
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .verdict-score strong {
            font-size: 28px;
            font-weight: 800;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .indicators-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .indicator-card {
            background: var(--white);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        .indicator-card h3 {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .indicator-value {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .indicator-meta {
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            width: fit-content;
        }
        .badge.confirmed { background: var(--badge-confirmed); color: var(--badge-confirmed-text); }
        .badge.estimated { background: var(--badge-estimated); color: var(--badge-estimated-text); }
        .badge.unavailable { background: var(--badge-unavailable); color: var(--badge-unavailable-text); }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            background: var(--white);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">BuildX</a>
        <a href="form.html" class="back-btn">← تعديل المعطيات</a>
    </header>

    <main>
        <div class="report-header">
            <h1>ملخص معطيات المشروع</h1>
            <div class="project-meta-grid" id="projectMeta"></div>
        </div>

        <!-- بطاقة تحليل الذكاء الاصطناعي الاستثماري -->
        <div class="ai-verdict-card" id="aiVerdictCard">
            <h2>🤖 التوصية الاستثمارية للذكاء الاصطناعي</h2>
            <div class="verdict-content">
                <div class="verdict-text">
                    <p id="aiAdviceText">جاري تحليل الميزانية، المساحة، ومعطيات السوق الموثقة...</p>
                </div>
                <div class="verdict-score">
                    <span>مؤشر الجدوى</span>
                    <strong id="aiScoreVal">--</strong>
                </div>
            </div>
        </div>

        <h2 class="section-title">مؤشرات وعوامل السوق (Data Sources Layer)</h2>
        
        <div class="indicators-grid" id="indicatorsContainer"></div>
    </main>

    <footer>
        <span>&copy; 2026 BuildX Data Engine. All rights reserved. AI Evaluation Active.</span>
    </footer>

    <script src="buildx-engine.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const userInput = {
                country: localStorage.getItem('project_country'),
                city: localStorage.getItem('project_city'),
                area: localStorage.getItem('project_area'),
                businessType: localStorage.getItem('project_business'),
                budget: localStorage.getItem('project_budget')
            };

            const metaContainer = document.getElementById('projectMeta');
            metaContainer.innerHTML = `
                <div class="meta-item"><span>الدولة</span><strong>${userInput.country || 'غير متوفر'}</strong></div>
                <div class="meta-item"><span>المدينة</span><strong>${userInput.city || 'غير متوفر'}</strong></div>
                <div class="meta-item"><span>المساحة</span><strong>${userInput.area ? userInput.area + ' م²' : 'غير متوفر'}</strong></div>
                <div class="meta-item"><span>النشاط التجاري</span><strong>${userInput.businessType || 'غير متوفر'}</strong></div>
                <div class="meta-item"><span>الميزانية</span><strong>${userInput.budget || 'غير متوفر'}</strong></div>
            `;

            const reportData = await window.buildXEngine.processMarketAnalysis(userInput);
            const indicators = reportData.indicators;
            const verdict = reportData.aiVerdict;

            // تحديث بطاقة الذكاء الاصطناعي
            document.getElementById('aiAdviceText').innerText = `حالة الجدوى: (${verdict.feasibility}). ${verdict.advice}`;
            document.getElementById('aiScoreVal').innerText = verdict.score;

            const statusLabels = {
                confirmed: 'مؤكدة (Confirmed)',
                estimated: 'تقديرية (Estimated)',
                unavailable: 'غير متوفرة (Unavailable)'
            };

            const indicatorsContainer = document.getElementById('indicatorsContainer');
            indicatorsContainer.innerHTML = `
                <div class="indicator-card">
                    <h3>التعداد السكاني والكثافة</h3>
                    <div class="indicator-value">${indicators.population.value}</div>
                    <div class="indicator-meta">
                        <span class="badge ${indicators.population.status}">${statusLabels[indicators.population.status]}</span>
                        <span><strong>المصدر:</strong> <a href="${indicators.population.sourceUrl}" target="_blank">${indicators.population.source}</a></span>
                        <span><strong>آخر تحديث:</strong> ${indicators.population.lastUpdated}</span>
                        <span><strong>درجة الثقة:</strong> ${indicators.population.confidence}</span>
                    </div>
                </div>

                <div class="indicator-card">
                    <h3>المنافسون في نفس النطاق</h3>
                    <div class="indicator-value">${indicators.competition.value}</div>
                    <div class="indicator-meta">
                        <span class="badge ${indicators.competition.status}">${statusLabels[indicators.competition.status]}</span>
                        <span><strong>المصدر:</strong> <a href="${indicators.competition.sourceUrl}" target="_blank">${indicators.competition.source}</a></span>
                        <span><strong>آخر تحديث:</strong> ${indicators.competition.lastUpdated}</span>
                        <span><strong>درجة الثقة:</strong> ${indicators.competition.confidence}</span>
                    </div>
                </div>

                <div class="indicator-card">
                    <h3>متوسط إيجار العقارات التجارية</h3>
                    <div class="indicator-value">${indicators.realEstate.value}</div>
                    <div class="indicator-meta">
                        <span class="badge ${indicators.realEstate.status}">${statusLabels[indicators.realEstate.status]}</span>
                        <span><strong>المصدر:</strong> <a href="${indicators.realEstate.sourceUrl}" target="_blank">${indicators.realEstate.source}</a></span>
                        <span><strong>آخر تحديث:</strong> ${indicators.realEstate.lastUpdated}</span>
                        <span><strong>درجة الثقة:</strong> ${indicators.realEstate.confidence}</span>
                    </div>
                </div>

                <div class="indicator-card">
                    <h3>القوة الشرائية ومؤشر الدخل</h3>
                    <div class="indicator-value">${indicators.economy.value}</div>
                    <div class="indicator-meta">
                        <span class="badge ${indicators.economy.status}">${statusLabels[indicators.economy.status]}</span>
                        <span><strong>المصدر:</strong> <a href="${indicators.economy.sourceUrl}" target="_blank">${indicators.economy.source}</a></span>
                        <span><strong>آخر تحديث:</strong> ${indicators.economy.lastUpdated}</span>
                        <span><strong>درجة الثقة:</strong> ${indicators.economy.confidence}</span>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
