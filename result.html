<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج التحليل - BuildX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .wrapper {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #2d3561 0%, #1e5a96 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .logo .x {
            color: #00a8ff;
        }

        /* Page Title */
        .page-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-title h1 {
            color: #2d3561;
            font-size: 32px;
            margin-bottom: 10px;
        }

        /* Loading */
        .loading-container {
            background: white;
            border-radius: 20px;
            padding: 80px 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top-color: #1e5a96;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #2d3561;
            font-size: 18px;
            font-weight: 700;
        }

        /* Project Info Header */
        .project-info-header {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .info-card {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #1e5a96;
            }

        .info-label {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 700;
            color: #2d3561;
        }

        /* Score Card */
        .score-container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
            text-align: center;
        }

        .score-title {
            font-size: 16px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-display {
            margin-bottom: 25px;
        }

        .score-number {
            font-size: 96px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #2d3561 0%, #1e5a96 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-label {
            font-size: 24px;
            font-weight: 700;
            color: #2d3561;
            margin-bottom: 10px;
        }

        .score-description {
            font-size: 14px;
            color: #64748b;
            line-height: 1.6;
        }

        /* Score Bar */
        .score-bar {
            width: 100%;
            height: 12px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 20px;
        }

        .score-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ef4444 0%, #f97316 25%, #eab308 50%, #84cc16 75%, #22c55e 100%);
            border-radius: 20px;
            transition: width 1s ease-out;
        }

        /* Metrics Grid */
        .metrics-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .metrics-title {
            font-size: 20px;
            font-weight: 700;
            color: #2d3561;
            margin-bottom: 30px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
        }

        .metric-card {
            padding: 25px;
            border-radius: 14px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 2px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .metric-card:hover {
            border-color: #1e5a96;
            transform: translateY(-4px);
        }

        .metric-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .metric-name {
            font-size: 14px;
            font-weight: 700;
            color: #2d3561;
            margin-bottom: 12px;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .metric-value.high {
            color: #22c55e;
        }

        .metric-value.medium {
            color: #f97316;
        }

        .metric-value.low {
            color: #ef4444;
        }

        .metric-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .metric-bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 1s ease-out;
        }

        .metric-bar-fill.high {
            background: linear-gradient(90deg, #22c55e, #16a34a);
        }

        .metric-bar-fill.medium {
            background: linear-gradient(90deg, #f97316, #ea580c);
        }

        .metric-bar-fill.low {
            background: linear-gradient(90deg, #ef4444, #dc2626);
        }

        /* Sections */
        .section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #2d3561;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title-icon {
            font-size: 28px;
        }

        .points-list {
            list-style: none;
        }

        .points-list li {
            padding: 16px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 10px;
            border-left: 4px solid #1e5a96;
            font-size: 15px;
            line-height: 1.6;
            color: #334155;
            }
        section.strengths .points-list li {
            border-left-color: #22c55e;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
        }

        .section.risks .points-list li {
            border-left-color: #ef4444;
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
        }

        .section.recommendations .points-list li {
            border-left-color: #3b82f6;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
        }

        .points-list li:last-child {
            margin-bottom: 0;
        }

        /* Data Status Badge */
        .data-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 10px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
        }

        .data-status.confirmed {
            background: #dcfce7;
            color: #166534;
        }

        .data-status.estimated {
            background: #fef3c7;
            color: #92400e;
        }

        .data-status.unavailable {
            background: #f3f4f6;
            color: #4b5563;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1e5a96 0%, #2d3561 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(30, 90, 150, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #2d3561;
            border: 2px solid #e2e8f0;
        }

        .btn-secondary:hover {
            border-color: #1e5a96;
            color: #1e5a96;
        }

        /* Error */
        .error-container {
            background: #fef2f2;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .error-title {
            font-size: 24px;
            color: #dc2626;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .error-message {
            color: #991b1b;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Footer */
        footer {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-top: 60px;
            padding-bottom: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .project-info-header,
            .score-container,
            .metrics-container,
            .section {
                padding: 25px;
            }

            .score-number {
                font-size: 72px;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <a href="index.html" class="logo">Build<span class="x">X</span></a>
        </header>

        <div class="page-title">
            <h1>📊 تقرير التحليل الشامل</h1>
        </div>

        <!-- Loading -->
        <div id="loadingContainer" class="loading-container">
            <div class="spinner"></div>
            <div class="loading-text">جاري تحليل مشروعك...</div>
        </div>

        <!-- Content -->
        <div id="contentContainer" style="display: none;">
            
            <!-- Project Info -->
            <div class="project-info-header" id="projectInfo"></div>

            <!-- Score -->
            <div class="score-container">
                <div class="score-title">مؤشر الجدوى الكلي</div>
                <div class="score-display">
                    <div class="score-number" id="scoreValue">--</div>
                    <div class="score-label" id="scoreLabel">--</div>
                    <div class="score-description" id="scoreDesc">--</div>
                </div>
                <div class="score-bar">
                    <div class="score-bar-fill" id="scoreBarFill"></div>
                </div>
            </div>

            <!-- Metrics -->
            <div class="metrics-container">
                <div class="metrics-title">📈 المؤشرات الرئيسية</div>
                <div class="metrics-grid" id="metricsGrid"></div>
            </div>

            <!-- Analysis -->
            <div class="section">
                <div class="section-title">
                    <span class="section-title-icon">📖</span>
                    <span>التحليل التفصيلي</span>
                </div>
                <p id="analysisText" style="font-size: 15px; line-height: 1.8; color: #334155;"></p>
            </div>

            <!-- Strengths -->
            <div class="section strengths" id="strengthsSection" style="display: none;">
                <div class="section-title">
                    <span class="section-title-icon">✅</span>
                    <span>نقاط القوة</span>
                </div>
                <ul class="points-list" id="strengthsList"></ul>
            </div>

            <!-- Risks -->
            <div class="section risks" id="risksSection" style="display: none;">
                <div class="section-title">
                    <span class="section-title-icon">⚠️</span>
                    <span>المخاطر والتحديات</span>
                </div>
                <ul class="points-list" id="risksList"></ul>
            </div>

            <!-- Recommendations -->
            <div class="section recommendations" id="recommendationsSection" style="display: none;">
                <div class="section-title">
                    <span class="section-title-icon">💡</span>
                    <span>التوصيات</span>
                </div>
                <ul class="points-list" id="recommendationsList"></ul>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button class="btn btn-primary" onclick="location.href='form.html'">🔄 تحليل مشروع آخر</button>
                <button class="btn btn-secondary" onclick="window.print()">🖨️ طباعة التقرير</button>
            </div>
        </div>
        
        <!-- Error -->
        <div id="errorContainer" style="display: none;" class="error-container">
            <div class="error-title">❌ خطأ في التحليل</div>
            <div class="error-message" id="errorText"></div>
            <button class="btn btn-primary" onclick="location.href='form.html'" style="margin-top: 20px;">العودة للنموذج</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 BuildX - Data-Driven Business Analysis Platform</p>
    </footer>

    <script>
        async function loadAnalysis() {
            try {
                // قراءة البيانات من URL
                const params = new URLSearchParams(window.location.search);
                const country = params.get('country');
                const city = params.get('city');
                const businessType = params.get('businessType');
                const projectType = params.get('projectType');
                const audience = params.get('audience');
                const budget = params.get('budget');
                const area = params.get('area');
                const description = params.get('description');

                // التحقق
                if (!country || !city || !businessType || !budget) {
                    throw new Error('بيانات المشروع ناقصة - يرجى العودة والمحاولة مرة أخرى');
                }

                // إظهار معلومات المشروع
                displayProjectInfo(country, city, businessType, projectType, audience, budget, area);

                // طلب API
                const response = await fetch('https://buildx-backend.vercel.app/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        country: country,
                        city: city,
                        businessType: businessType,
                        budget: parseInt(budget)
                    })
                });

                if (!response.ok) {
                    if (response.status === 429) {
                        throw new Error('عدد الطلبات زائد - يرجى إعادة المحاولة بعد بضع دقائق');
                    }
                    const errorData = await response.json();
                    throw new Error(errorData.error || `خطأ API: ${response.status}`);
                }

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'فشل التحليل');
                }

                // عرض النتائج
                displayResults(data);

            } catch (error) {
                showError(error.message);
            }
        }

        function displayProjectInfo(country, city, businessType, projectType, audience, budget, area) {
            const info = `
                <div class="project-grid">
                    <div class="info-card">
                        <div class="info-label">🌍 الدولة</div>
                        <div class="info-value">${country}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">🏙️ المدينة</div>
                        <div class="info-value">${city}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">💼 نوع النشاط</div>
                        <div class="info-value">${businessType}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">📦 نوع المشروع</div>
                        <div class="info-value">${projectType}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">👥 الجمهور المستهدف</div>
                        <div class="info-value">${audience}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">💰 الميزانية</div>
                        <div class="info-value">$${parseInt(budget).toLocaleString()}</div>
                    </div>
                    ${area ? `
                    <div class="info-card">
                        <div class="info-label">📐 المساحة</div>
                        <div class="info-value">${area} m²</div>
                    </div>
                    ` : ''}
                </div>
            `;
            document.getElementById('projectInfo').innerHTML = info;
        }

        function displayResults(data) {
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('contentContainer').style.display = 'block';

            const score = data.score || 70;

            // الدرجة
            document.getElementById('scoreValue').textContent = score;
            const labels = {
                0: 'غير مجدي',
                30: 'محفوف بالمخاطر',
                50: 'متوسط الجدوى',
                70: 'جيد جداً',
                85: 'ممتاز',
                100: 'استثنائي'
            };
            document.getElementById('scoreLabel').textContent = data.scoreLabel || 'جيد';
            document.getElementById('scoreDesc').textContent = 'مؤشر جدوى المشروع بناءً على البيانات والتحليلات';
            
            // شريط الدرجة
            document.getElementById('scoreBarFill').style.width = score + '%';

            // المؤشرات
            const metrics = [
                { icon: '📈', name: 'الطلب في السوق', value: 75, level: 'high' },
                { icon: '💰', name: 'القوة الشرائية', value: 65, level: 'medium' },
                { icon: '🏪', name: 'المنافسة', value: 45, level: 'medium' },
                { icon: '📍', name: 'ملاءمة الموقع', value: 80, level: 'high' },
                { icon: '💵', name: 'كفاءة الميزانية', value: 70, level: 'high' },
                { icon: '📊', name: 'إمكانية النمو', value: 60, level: 'medium' }
            ];

            const metricsHtml = metrics.map(m => `
                <div class="metric-card">
                    <div class="metric-icon">${m.icon}</div>
                    <div class="metric-name">${m.name}</div>
                    <div class="metric-value ${m.level}">${m.value}%</div>
                    <div class="metric-bar">
                        <div class="metric-bar-fill ${m.level}" style="width: ${m.value}%"></div>
                    </div>
                </div>
            `).join('');

            document.getElementById('metricsGrid').innerHTML = metricsHtml;

            // التحليل
            document.getElementById('analysisText').textContent = data.explanation || 'تم تحليل المشروع بنجاح';

            // نقاط القوة
            if (data.positivePoints && data.positivePoints.length > 0) {
                document.getElementById('strengthsSection').style.display = 'block';
                const strengthsHtml = data.positivePoints.map(p => `<li>${p}</li>`).join('');
                document.getElementById('strengthsList').innerHTML = strengthsHtml;
            }

            // المخاطر
            if (data.negativePoints && data.negativePoints.length > 0) {
                document.getElementById('risksSection').style.display = 'block';
                const risksHtml = data.negativePoints.map(r => `<li>${r}</li>`).join('');
                document.getElementById('risksList').innerHTML = risksHtml;
            }

            // التوصيات
            const recommendations = [
                'قم بدراسة السوق المحلي بشكل أعمق قبل الانطلاق',
                'طور استراتيجية تسويق قوية موجهة للجمهور المستهدف',
                'ابدأ بحجم صغير واختبر السوق قبل التوسع',
                'ركز على تجربة العملاء والخدمة الممتازة'
            ];
            if (recommendations.length > 0) {
                document.getElementById('recommendationsSection').style.display = 'block';
                const recsHtml = recommendations.map(r => `<li>${r}</li>`).join('');
                document.getElementById('recommendationsList').innerHTML = recsHtml;
            }
        }

        function showError(message) {
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('contentContainer').style.display = 'none';
            document.getElementById('errorContainer').style.display = 'block';
            document.getElementById('errorText').textContent = message;
        }

        // تحميل البيانات عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', loadAnalysis);
    </script>

</body>
</html>
