<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildX - محلل المشاريع</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', Arial; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 20px; padding: 40px; max-width: 600px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #1e3a8a; margin-bottom: 10px; font-size: 32px; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 40px; }
        .form-group { margin-bottom: 25px; }
        label { display: block; color: #1e3a8a; font-weight: 600; margin-bottom: 8px; }
        input, select { width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 16px; font-family: inherit; text-align: right; }
        input:focus, select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 BuildX</h1>
        <p class="subtitle">محلل فرص المشاريع الذكي</p>

        <form id="projectForm" onsubmit="handleAnalyze(event)">
            <div class="form-group">
                <label>🌍 الدولة</label>
                <select id="countrySelect">
                    <option value="USA">الولايات المتحدة</option>
                    <option value="UAE">الإمارات</option>
                    <option value="Saudi">السعودية</option>
                    <option value="Egypt">مصر</option>
                </select>
            </div>

            <div class="form-group">
                <label>🏙️ المدينة</label>
                <input type="text" id="cityInput" placeholder="مثال: New York" required>
            </div>

            <div class="form-group">
                <label>💼 نوع المشروع</label>
                <select id="businessTypeSelect" required>
                    <option value="">-- اختر --</option>
                    <option value="مطعم">مطعم</option>
                    <option value="كافيه">كافيه</option>
                    <option value="متجر ملابس">متجر ملابس</option>
                    <option value="صالون تجميل">صالون تجميل</option>
                    <option value="جيم">جيم</option>
                </select>
            </div>

            <div class="form-group">
                <label>💰 الميزانية ($)</label>
                <input type="number" id="budgetInput" placeholder="مثال: 50000" min="1000" required>
            </div>

            <button type="submit">ابدأ تحليل مشروعك</button>
        </form>
    </div>

    <script>
        function handleAnalyze(event) {
            event.preventDefault();

            const country = document.getElementById('countrySelect').value;
            const city = document.getElementById('cityInput').value.trim();
            const businessType = document.getElementById('businessTypeSelect').value;
            const budget = document.getElementById('budgetInput').value;

            if (!city || !businessType || !budget) {
                alert('الرجاء ملء جميع الحقول');
                return;
            }

            const params = new URLSearchParams({
                country: country,
                city: city,
                businessType: businessType,
                budget: budget
            });

            window.location.href = `result.html?${params.toString()}`;
        }
    </script>
</body>
</html>
