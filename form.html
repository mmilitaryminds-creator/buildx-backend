<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildX - تحليل المشاريع</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #2d3561 0%, #1e5a96 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            display: inline-block;
        }

        .logo .x {
            color: #00a8ff;
        }

        .page-header {
            margin-top: 30px;
        }

        .page-header h1 {
            color: #2d3561;
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .page-header p {
            color: #64748b;
            font-size: 16px;
            font-weight: 500;
        }

        /* Form Container */
        .form-wrapper {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            margin-bottom: 50px;
        }

        /* Section */
        .form-section {
            margin-bottom: 50px;
        }

        .form-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #2d3561;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title-icon {
            font-size: 24px;
        }

        /* Grid Layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        .form-grid.full {
            grid-template-columns: 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #2d3561;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label-hint {
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
            font-family: 'Inter', sans-serif;
        }

        input, select, textarea {
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 16px;
            text-align: right;
            transition: all 0.3s ease;
            background: #f8fafc;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #1e5a96;
            background: white;
            box-shadow: 0 0 0 4px rgba(30, 90, 150, 0.1);
        }

        /* Select */
        select {
            cursor: pointer;
        }

        /* Textarea */
        textarea {
            resize: vertical;
            min-height: 140px;
            font-family: 'Cairo', sans-serif;
        }

        .char-counter {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 8px;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }

        .char-counter.warning {
            color: #f97316;
        }

        /* Cards Selection */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        card-option {
            padding: 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8fafc;
        }

        .card-option:hover {
            border-color: #1e5a96;
            background: white;
            transform: translateY(-2px);
        }

        .card-option.selected {
            background: #1e5a96;
            border-color: #1e5a96;
            color: white;
        }

        .card-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .card-text {
            font-size: 14px;
            font-weight: 600;
        }

        /* Buttons Grid */
        .buttons-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .btn-option {
            padding: 11px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            background: white;
            color: #2d3561;
            font-family: 'Cairo', sans-serif;
        }

        .btn-option:hover {
            border-color: #1e5a96;
            color: #1e5a96;
        }

        .btn-option.selected {
            background: #1e5a96;
            border-color: #1e5a96;
            color: white;
        }

        /* Submit Button */
        .submit-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e2e8f0;
        }

        .submit-btn {
            width: 100%;
            padding: 16px 30px;
            background: linear-gradient(135deg, #1e5a96 0%, #2d3561 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(30, 90, 150, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Loading Overlay */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 30, 0.95);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 70px;
            height: 70px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #00a8ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: white;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
        }

        .loading-subtext {
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
        }

        /* Error Message */
        .error-message {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px 14px;
            border-radius: 8px;
            border-left: 4px solid #dc2626;
            font-size: 14px;
            display: none;
            margin-top: 8px;
            font-family: 'Inter', sans-serif;
        }

        /* Footer */
        footer {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-top: 60px;
            padding-bottom: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-wrapper {
                padding: 30px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <a href="index.html" class="logo">Build<span class="x">X</span></a>
            <div class="page-header">
                <h1>تحليل المشروع</h1>
                <p>استكشف إمكانيات نجاح مشروعك مع تحليل ذكي شامل</p>
            </div>
        </header>

        <div class="form-wrapper">
            <form id="projectForm">
                <!-- الموقع الجغرافي -->
                <div class="form-section">
                    <div class="section-title">
                        <span class="section-title-icon">🌍</span>
                        <span>الموقع الجغرافي</span>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>الدولة</label>
                            <select id="country" required>
                                <option value="">-- اختر الدولة --</option>
                                <option value="USA">الولايات المتحدة</option>
                                <option value="UAE">الإمارات العربية</option>
                                <option value="Saudi">المملكة العربية السعودية</option>
                                <option value="Egypt">مصر</option>
                                <option value="Algeria">الجزائر</option>
                                <option value="Morocco">المغرب</option>
                                <option value="Qatar">قطر</option>
                                <option value="Kuwait">الكويت</option>
                            </select>
                            <div class="error-message" id="countryError"></div>
                        </div>
                        <div class="form-group">
                            <label>المدينة</label>
                            <input type="text" id="city" placeholder="مثال: دبي، نيويورك، الرياض" required>
                            <div class="error-message" id="cityError"></div>
                        </div>
                    </div>
                </div>

                <!-- تفاصيل المشروع -->
                <div class="form-section">
                    <div class="section-title">
                        <span class="section-title-icon">📦</span>
                        <span>تفاصيل المشروع</span>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>نوع النشاط التجاري</label>
                            <select id="businessType" required>
                                <option value="">-- اختر نوع النشاط --</option>
                                <option value="مطعم">مطعم</option>
                                <option value="كافيه">كافيه</option>
                                <option value="متجر ملابس">متجر ملابس</option>
                                <option value="صالون تجميل">صالون تجميل</option>
                                <option value="جيم">جيم</option>
                                <option value="فندق">فندق</option>
                                <option value="متجر إلكترونيات">متجر إلكترونيات</option>
                                <option value="مكتبة">مكتبة</option>
                                <option value="صيدلية">صيدلية</option>
                            </select>
                            <div class="error-message" id="businessError"></div>
                        </div>
                        <div class="form-group">
                            <label>نوع المشروع</label>
                            <div class="cards-grid">
                                <div class="card-option" data-value="مشروع جديد" onclick="selectCard(this)">
                                    <div class="card-icon">🆕</div>
                                    <div class="card-text">جديد</div>
                                </div>
                                <div class="card-option" data-value="توسعة" onclick="selectCard(this)">
                                    <div class="card-icon">📈</div>
                                    <div class="card-text">توسعة</div>
                                </div>
                                <div class="card-option" data-value="شراكة" onclick="selectCard(this)">
                                    <div class="card-icon">🤝</div>
                                    <div class="card-text">شراكة</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- الجمهور والميزانية -->
                <div class="form-section">
                    <div class="section-title">
                        <span class="section-title-icon">👥</span>
                        <span>الجمهور والميزانية</span>
                    </div>
                    <div class="form-group" style="margin-bottom: 25px;">
                        <label>الفئة المستهدفة</label>
                        <div class="buttons-grid">
                            <button type="button" class="btn-option" onclick="selectAudience(this)">الشباب (18-30)</button>
                            <button type="button" class="btn-option" onclick="selectAudience(this)">العائلات</button>
                            <button type="button" class="btn-option" onclick="selectAudience(this)">رجال الأعمال</button>
                            <button type="button" class="btn-option" onclick="selectAudience(this)">كبار السن</button>
                        </div>
                        <div class="error-message" id="audienceError"></div>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>الميزانية <span class="label-hint">(USD)</span></label>
                            <input type="number" id="budget" placeholder="50000" min="1" required>
                        </div>
                        <div class="form-group">
                            <label>المساحة <span class="label-hint">(متر مربع)</span></label>
                            <input type="number" id="area" placeholder="300" min="0">
                        </div>
                    </div>
                </div>

                <!-- وصف المشروع -->
                <div class="form-section">
                    <div class="section-title">
                        <span class="section-title-icon">📝</span>
                        <span>وصف المشروع</span>
                    </div>
                    <div class="form-group">
                        <label>
                            صف مشروعك بالتفصيل
                            <span class="label-hint" id="charCount">0 / 60,000</span>
                        </label>
                        <textarea id="projectDescription" placeholder="اكتب تفاصيل مشروعك، رؤيتك، أهدافك، وكيف ستختلف عن المنافسين..."></textarea>
                        <div class="char-counter" id="charWarning"></div>
                    </div>
                </div>

                <!-- Submit -->
                <div class="submit-section">
                    <button type="button" class="submit-btn" onclick="handleAnalysis()">
                        <span>ابدأ التحليل الآن</span>
                        <span>→</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">🔍 جاري تحليل المشروع</div>
        <div class="loading-subtext">يقوم BuildX بجمع البيانات من مصادر متعددة وتحليلها...</div>
    </div>

    <footer>
        <p>&copy; 2026 BuildX - Data-Driven Business Analysis Platform</p>
    </footer>

    <script>
        let audioCtx = null;

        function playSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {}
        }

        // عداد الأحرف
        document.getElementById('projectDescription').addEventListener('input', function() {
            const count = this.value.length;
            document.getElementById('charCount').textContent = count + ' / 60,000';
            
            if (count > 60000) {
                this.value = this.value.substring(0, 60000);
            }
            
            if (count > 50000) {
                document.getElementById('charWarning').textContent = '⚠️ اقتراب الحد الأقصى';
                document.getElementById('charWarning').style.display = 'block';
            } else {
                document.getElementById('charWarning').style.display = 'none';
            }
        });

        // اختيار البطاقات
        function selectCard(element) {
            element.parentElement.querySelectorAll('.card-option').forEach(e => {
                e.classList.remove('selected');
            });
            element.classList.add('selected');
            playSound();
        }

        // اختيار الجمهور
        function selectAudience(element) {
            element.parentElement.querySelectorAll('.btn-option').forEach(e => {
                e.classList.remove('selected');
            });
            element.classList.add('selected');
            playSound();
        }

        // معالج التحليل
        function handleAnalysis() {
            playSound();

            const country = document.getElementById('country').value;
            const city = document.getElementById('city').value;
            const businessType = document.getElementById('businessType').value;
            const selectedType = document.querySelector('.card-option.selected');
            const selectedAudience = document.querySelector('.btn-option.selected');
            const budget = document.getElementById('budget').value;
            const area = document.getElementById('area').value;
            const description = document.getElementById('projectDescription').value;

            // التحقق
            if (!country) {
                document.getElementById('countryError').textContent = '⚠️ اختر الدولة';
                document.getElementById('countryError').style.display = 'block';
                return;
            }
            if (!city) {
                document.getElementById('cityError').textContent = '⚠️ أدخل اسم المدينة';
                document.getElementById('cityError').style.display = 'block';
                return;
            }
            if (!businessType) {
                document.getElementById('businessError').textContent = '⚠️ اختر نوع النشاط';
                document.getElementById('businessError').style.display = 'block';
                return;
            }
            if (!selectedType) {
                alert('⚠️ اختر نوع المشروع');
                return;
            }
            if (!selectedAudience) {
                document.getElementById('audienceError').textContent = '⚠️ اختر الفئة المستهدفة';
                document.getElementById('audienceError').style.display = 'block';
                return;
            }
            if (!budget || budget <= 0) {
                alert('⚠️ أدخل ميزانية صحيحة');
                return;
            }

            // إظهار التحميل
            document.getElementById('loadingOverlay').classList.add('active');

            // بناء الرابط
            const params = new URLSearchParams({
                country: country,
                city: city,
                businessType: businessType,
                projectType: selectedType.dataset.value,
                audience: selectedAudience.textContent,
                budget: budget,
                area: area,
                description: description
            });

            // الانتقال
            setTimeout(() => {
                window.location.href = `result.html?${params.toString()}`;
            }, 500);
        }
    </script>

</body>
</html>
