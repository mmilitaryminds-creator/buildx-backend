<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildX - تحليل المشروع</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-light: #3b82f6;
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #475569;
            --white: #ffffff;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            flex-direction: column;
            display: flex;
        }

        header {
            width: 100%;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--white);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-color);
            text-decoration: none;
        }

        .back-btn {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--primary-color);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .form-container {
            background: var(--white);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: #f8fafc;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--primary-light);
            background-color: var(--white);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .submit-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: var(--white);
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        footer {
            bottom: 0;
            width: 100%;
            padding: 20px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            background: var(--white);
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">BuildX</a>
        <a href="index.html" class="back-btn">&larr; العودة</a>
    </header>

    <main>
        <div class="form-container">
            <h1 style="text-align: center; margin-bottom: 30px; color: var(--primary-color);">هل مشروعك يستحق الاستثمار؟</h1>

            <!-- الحقول الأساسية -->
            <div style="margin-bottom: 20px;">
                <label for="country">🌍 الدولة</label>
                <input id="country" type="text" placeholder="مثال: الولايات المتحدة">
            </div>

            <div style="margin-bottom: 20px;">
                <label for="city">🏙️ المدينة</label>
                <input id="city" type="text" placeholder="مثال: دبي">
            </div>

            <div style="margin-bottom: 20px;">
                <label for="area">📐 مساحة المشروع</label>
                <input id="area" type="number" placeholder="مثال: 2222 م²">
            </div>

            <div style="margin-bottom: 20px;">
                <label for="businessType">🏢 نوع المشروع</label>
                <input id="businessType" type="text" placeholder="مثال: مطعم">
            </div>

            <div style="margin-bottom: 20px;">
                <label for="audience">👥 الجمهور المستهدف</label>
                <input id="audience" type="text" placeholder="مثال: العائلات والموظفين">
            </div>

            <div style="margin-bottom: 20px;">
                <label for="budget">💰 الميزانية بالدولار الأمريكي</label>
                <input id="budget" type="number" placeholder="مثال: $682">
            </div>

            <!-- مربع الكتابة الكبير + عداد الأحرف + زر السهم -->
            <div style="margin-top: 30px;">
                <label for="projectDescription">📝 صف مشروعك بالتفصيل:</label>
                <textarea id="projectDescription" maxlength="60000" placeholder="اكتب هنا تفاصيل مشروعك، أهدافك، التحديات..." style="width: 100%; height: 250px; padding: 14px; border: 1px solid var(--border-color); border-radius: 12px; background: #f8fafc; font-size: 15px; resize: vertical;"></textarea>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                    <span id="charCount" style="font-size: 14px; color: var(--text-muted);">0 / 60,000</span>
                    <button id="aiButton" style="background: var(--primary-color); color: white; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 24px; cursor: pointer;">→</button>
                </div>
            </div>

            <!-- مكان عرض النتيجة -->
            <div id="analysisResult" style="margin-top: 30px; border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; display: none; line-height: 1.8; white-space: pre-wrap;"></div>
        </div>
    </main>

    <footer>
        <span>&copy; 2026 BuildX Data Engine. All rights reserved.</span>
    </footer>

    <script>
        // عداد الأحرف
        const textarea = document.getElementById('projectDescription');
        const charCount = document.getElementById('charCount');

        textarea.addEventListener('input', function () {
            charCount.innerText = this.value.length + " / 60,000";
            if (this.value.length > 60000) {
                this.value = this.value.substring(0, 60000);
            }
        });

        // إرسال البيانات إلى AI
        async function sendToAI() {
            const description = textarea.value;
            const resultDiv = document.getElementById('analysisResult');

            // قراءة البيانات من النموذج
            const projectData = {
                country: document.getElementById('country').value,
                city: document.getElementById('city').value,
                area: document.getElementById('area').value,
                businessType: document.getElementById('businessType').value,
                audience: document.getElementById('audience').value,
                budget: document.getElementById('budget').value
            };

            if (description.trim() === "") {
                alert("الرجاء كتابة وصف المشروع أولاً");
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.innerText = "جاري تحليل البيانات الحقيقية...";

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: description, projectData: projectData })
                });

                const data = await response.json();
                if (data.result) {
                    resultDiv.innerText = data.result;
                } else {
                    resultDiv.innerText = "خطأ: " + (data.error || "حدث خطأ ما");
                }
            } catch (error) {
                resultDiv.innerText = "خطأ في الاتصال: " + error;
            }
        }

        // ربط زر السهم
        document.getElementById('aiButton').addEventListener('click', sendToAI);
    </script>
</body>
</html>
